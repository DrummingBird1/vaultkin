name: Setup pnpm + Node + install
description: >
  Checks out is NOT included (each job still needs its own actions/checkout@v4
  first, since composite actions run inside the job's already-checked-out
  workspace). This just DRYs up the pnpm/Node setup + install steps that were
  previously copy-pasted verbatim into every job in ci.yml.
inputs:
  node-version:
    description: Node.js version (pnpm 11, pinned in package.json, needs Node 22)
    required: false
    default: "22"
runs:
  using: composite
  steps:
    # No version here: it comes from package.json's packageManager field.
    # Passing one too fails with "Multiple versions of pnpm specified".
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"
    - run: pnpm install --frozen-lockfile
      shell: bash
