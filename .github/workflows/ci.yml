# .github/workflows/ci.yml
# SecureVault CI/CD Pipeline
#
# Runs on every PR and push to main:
#   1. Type-check (tsc --noEmit)
#   2. Lint (ESLint)
#   3. Unit + integration tests with coverage
#   4. Build (Vite)
#   5. Security audit (npm audit)
#
# On release tag (v*.*.*): builds cross-platform Electron distributables.

name: CI

on:
  push:
    branches: [main, develop]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main, develop]

concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  COVERAGE_THRESHOLD: '80'

# ─── Jobs ─────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Type Check ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Type-check Electron main process
        run: npx tsc -p tsconfig.electron.json --noEmit

  # ── 2. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=verbose --reporter=junit
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/junit.xml
          retention-days: 30

  # ── 4. Build (Web/PWA) ────────────────────────────────────────────────────
  build-web:
    name: Build (PWA)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/renderer/
          retention-days: 7

  # ── 5. Security Audit ────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high
      - name: Check for known vulnerabilities in crypto dependencies
        run: |
          echo "Checking @noble/ciphers..."
          npm list @noble/ciphers
          echo "Checking argon2-browser..."
          npm list argon2-browser

  # ── 6. Electron Builds (release tags only) ────────────────────────────────
  build-electron:
    name: Build Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [typecheck, lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            args: --mac --universal
          - os: windows-latest
            platform: Windows
            args: --win
          - os: ubuntu-latest
            platform: Linux
            args: --linux

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (macOS)
        if: matrix.platform == 'macOS'
        run: npm run electron:dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # Code signing: set CSC_LINK + CSC_KEY_PASSWORD in secrets

      - name: Build Electron (Windows)
        if: matrix.platform == 'Windows'
        run: npm run electron:dist:win

      - name: Build Electron (Linux)
        if: matrix.platform == 'Linux'
        run: npm run electron:dist:linux

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-${{ github.ref_name }}
          path: release/**/*
          retention-days: 90

  # ── 7. GitHub Release (auto-create on tag) ────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-electron]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          merge-multiple: true
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft:     true
          files:     release-artifacts/**/*
          body: |
            ## SecureVault ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS    | SecureVault-*.dmg |
            | Windows  | SecureVault-Setup-*.exe |
            | Linux    | SecureVault-*.AppImage / .deb / .rpm |

            ### Verification
            SHA-256 checksums are attached to this release.
            Verify before installing: `shasum -a 256 <file>`
