# .github/workflows/ci.yml
# Vaultkin CI/CD Pipeline
#
# Runs on every PR and push to main:
#   1. Type-check (tsc --noEmit)
#   2. Lint (ESLint)
#   3. Unit + integration tests with coverage
#   4. Lockfile / dependency policy checks (lockfile-lint, pnpm audit, SBOM)
#   5. Build (Vite)
#   6. Lighthouse (Core Web Vitals on the app shell — advisory, "warn" only)
#   7. E2E (Playwright, against a real dev server — Chromium/Firefox/WebKit)
#   8. Extension (esbuild bundle + manifest validation)
#
# On release tag (v*.*.*): builds cross-platform Electron distributables and
# publishes a draft GitHub Release with SHA-256 checksums attached.
#
# See also: .github/workflows/scheduled-audit.yml — a cron job that reruns
# the dependency/E2E checks independent of any push, so newly-disclosed CVEs
# or environment drift get caught even when nobody's touched the code.
#
# Package manager: pnpm (see packageManager field in package.json +
# pnpm-workspace.yaml). CLAUDE.md's global guidelines require pnpm over npm/yarn.
# Every job's checkout + pnpm/Node setup + install is DRY'd into
# .github/actions/setup (a local composite action) instead of being
# copy-pasted per job.

name: CI

on:
  push:
    branches: [master, main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: every job only gets read access unless it
# explicitly needs more (the `release` job below overrides this with
# `contents: write` because it publishes a GitHub Release).
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Coverage thresholds live in config/vitest.config.ts (core 95/90/90/85, rest a ratchet floor).

# ─── Jobs ─────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Type Check ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc --noEmit
      - name: Type-check Electron main process
        run: pnpm exec tsc -p config/tsconfig.electron.json --noEmit
      - name: Type-check electron-builder.ts
        run: pnpm run typecheck:electron-builder

  # ── 2. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Ratchet: pre-existing warnings as of the tooling-upgrade session.
      # New code should not add to this count — lower it over time instead
      # of letting it silently grow.
      - run: pnpm run lint --max-warnings=43

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run tests with coverage
        run: pnpm run test:coverage --reporter=verbose --reporter=junit
        env:
          CI: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/junit.xml
          retention-days: 30

  # ── 4. Dependency & supply-chain checks ───────────────────────────────────
  dependency-check:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint lockfile (registry / integrity policy)
        run: pnpm run lockfile:lint
      # Blocks on what ships: production dependencies. Dev tooling (test
      # runners, bundlers, wait-on) is reported by the next step without failing
      # the run, since none of it reaches the vault's users.
      - name: pnpm audit, production dependencies (high severity)
        run: pnpm audit --prod --audit-level=high
      - name: pnpm audit, all dependencies (report only)
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Check crypto dependency versions
        run: |
          echo "Checking hash-wasm (Argon2id)..."
          pnpm list hash-wasm
          echo "Checking qrcode-generator..."
          pnpm list qrcode-generator
      - name: Generate SBOM (CycloneDX)
        run: pnpm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # ── 5. Build (Web/PWA) ────────────────────────────────────────────────────
  build-web:
    name: Build (PWA)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/renderer/
          retention-days: 7

  # ── 6. Lighthouse (Core Web Vitals) ───────────────────────────────────────
  # Audits the app shell only (index.html → unlock/create-vault screen) —
  # the only thing an anonymous crawl can ever see, since Lighthouse can't
  # unlock a vault. Assertions are "warn" (see config/lighthouserc.cjs), so
  # this reports scores without blocking PRs — there's no established
  # baseline yet to safely gate on.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build-web]
    # Advisory, as config/lighthouserc.cjs says: the lighthouse:no-pwa preset
    # turns many audits into errors, so the job reports without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/renderer
      - run: pnpm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 30

  # ── 7. E2E (Playwright) ──────────────────────────────────────────────────
  # config/playwright.config.ts deliberately disables its own webServer
  # auto-start when CI=true (Playwright's built-in server lifecycle was less
  # predictable in CI than just starting it ourselves and waiting on the
  # port), so this job starts `pnpm run dev` in the background and waits for
  # it before running tests. Runs the full 3-browser project matrix declared
  # in playwright.config.ts (chromium/firefox/webkit) to match the
  # browserslist config in package.json instead of Chromium-only.
  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Start dev server in background
        run: pnpm run dev &
      - name: Wait for dev server
        run: pnpm exec wait-on http://localhost:5173 --timeout 60000
      - name: Run Playwright tests
        run: pnpm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 8. Extension (build + manifest validation) ───────────────────────────
  # extension/ is a separate, non-bundled MV3 target (see extension/README.md).
  # This job bundles it with esbuild (scripts/build-extension.mjs) and
  # validates manifest.json against Chrome Web Store constraints
  # (scripts/validate-extension-manifest.mjs) on every change.
  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Validate manifest.json
        run: node scripts/validate-extension-manifest.mjs
      - name: Build extension bundle
        run: pnpm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/extension/
          retention-days: 7

  # ── 8b. Store packages + CLI (release tags only) ──────────────────────────
  release-extras:
    name: Extension store packages + CLI
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build release extension (no dev hosts) and CLI
        run: |
          pnpm run build:extension:release
          pnpm run build:cli
      - name: Zip store packages
        run: |
          mkdir -p extras
          (cd dist/extension && zip -qr "../../extras/Vaultkin-extension-chrome-${GITHUB_REF_NAME}.zip" .)
          (cd dist/extension-firefox && zip -qr "../../extras/Vaultkin-extension-firefox-${GITHUB_REF_NAME}.zip" .)
          cp dist/cli/sv.cjs "extras/sv-${GITHUB_REF_NAME}.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: electron-extras-${{ github.ref_name }}
          path: extras/*
          retention-days: 90

  # ── 9. Electron Builds (release tags only) ────────────────────────────────
  # Packaged by electron-builder.ts (project root) via the electron:dist:*
  # scripts. Only triggers on `v*.*.*` tag pushes, so it doesn't block normal
  # PR/push CI. Unsigned on all platforms (no CSC_LINK/CSC_KEY_PASSWORD or
  # Apple notarization secrets configured yet) — installers will trigger an
  # OS "unknown publisher" warning until code-signing certs are added.
  build-electron:
    name: Build Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [typecheck, lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            args: --mac --universal
          - os: windows-latest
            platform: Windows
            args: --win
          - os: ubuntu-latest
            platform: Linux
            args: --linux

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build Electron (macOS)
        if: matrix.platform == 'macOS'
        run: pnpm run electron:dist:mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # Code signing: set CSC_LINK + CSC_KEY_PASSWORD in secrets

      # The extension host must be universal (x64 + arm64) and must run.
      # Exit code 2 = "missing extension origin": the host started correctly.
      - name: Check universal bridge host (macOS)
        if: matrix.platform == 'macOS'
        run: |
          host="$(find release -path '*Vaultkin.app/Contents/Resources/bridge-host/vaultkin-bridge-host' | head -1)"
          test -n "$host"
          lipo -info "$host" | grep -q 'x86_64 arm64'
          codesign --verify "$host"
          set +e; "$host"; code=$?; set -e
          test "$code" = 2

      - name: Build Electron (Windows)
        if: matrix.platform == 'Windows'
        run: pnpm run electron:dist:win --publish never

      - name: Build Electron (Linux)
        if: matrix.platform == 'Linux'
        run: pnpm run electron:dist:linux --publish never

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-${{ github.ref_name }}
          path: release/**/*
          retention-days: 90

  # ── 10. GitHub Release (auto-create on tag) ───────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-electron, release-extras, dependency-check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write # signed build provenance (Sigstore via GitHub attestations)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          merge-multiple: true
          path: release-artifacts/

      # The release body below promises "SHA-256 checksums are attached" —
      # this step is what actually makes that true. Previously nothing
      # computed them, so the promise in the body was empty.
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: release-artifacts/

      # Installers / packages only (electron-builder also leaves unpacked dirs
      # and blockmaps; those aren't release assets).
      - name: Collect release files
        run: |
          mkdir -p out
          find release-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.cjs' -o -name 'latest*.yml' \
            -o -name 'sbom.json' \) -not -path '*unpacked*' -exec cp {} out/ \;
          ls -la out

      - name: Generate SHA-256 checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "out/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: out/*
          body: |
            ## Vaultkin ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS    | Vaultkin-*.dmg |
            | Windows  | Vaultkin-Setup-*.exe |
            | Linux    | Vaultkin-*.AppImage / .deb / .rpm |

            ### Verification
            SHA-256 checksums are attached to this release as `SHA256SUMS.txt`.
            Verify before installing: `shasum -a 256 -c SHA256SUMS.txt`
            Build provenance (Sigstore): `gh attestation verify <file> --repo ${{ github.repository }}`
            SBOM (CycloneDX): `sbom.json`
