<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Vaultkin – Zero-knowledge password manager and 2FA authenticator."
    />
    <meta name="theme-color" content="#0D0D12" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA -->
    <meta name="application-name" content="Vaultkin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vaultkin" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Security: no-referrer, no-sniff enforced via HTTP headers (see main.ts + vite.config.ts) -->
    <meta name="referrer" content="no-referrer" />

    <!-- Fonts are bundled (@fontsource, see src/main.tsx): no request to a
         third-party font CDN, works offline and under a strict CSP. -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />

    <title>Vaultkin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
